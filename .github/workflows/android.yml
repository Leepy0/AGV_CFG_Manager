name: android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Phase 6: 태그 v*.*.* 푸시 또는 workflow_dispatch(release=true) 로 정식 릴리스 경로를 추가한다.
  #   release 채널 빌드 → 릴리스 keystore 서명(GitHub Secrets) → AgvCfgManager.apk / .sha256 / .json 매니페스트 → Release 생성.
  #   docs/DEVELOPMENT_PLAN.md 12장 참고. 여기서는 자리만 둔다.

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build debug APK
        run: ./gradlew :core:test :app:assembleDebug -Pchannel=dev

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: core/build/reports/tests/
          if-no-files-found: ignore

      - name: Publish dev prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AgvCfgManager-dev.apk
          # 같은 이름의 dev 릴리스와 태그를 지운 뒤 다시 만든다 (prerelease 는 Latest 로 올라가지 않는다).
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev AgvCfgManager-dev.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "dev (main 최신 디버그 빌드)" \
            --notes "main 커밋 ${GITHUB_SHA::7} 의 디버그 빌드입니다. 정식 릴리스가 아닙니다."
